# VANTOR Genesis configuration
# Keep versions and target settings explicit; do not use floating source versions.

VANTOR_NAME="VANTOR Linux"
VANTOR_VERSION="0.1.0"
VANTOR_CODENAME="Genesis"

VANTOR_ARCH="x86_64"
VANTOR_TARGET="x86_64-vantor-linux-gnu"

# Initial source components.
VANTOR_KERNEL="linux"
VANTOR_KERNEL_VERSION="6.18.65"
VANTOR_KERNEL_ARCH="x86_64"

# Optional legacy profile: Linux 6.1 retains 486-class CPU support.
VANTOR_LEGACY_KERNEL_VERSION="6.1.193"
VANTOR_LEGACY_KERNEL_ARCH="i386"
VANTOR_LEGACY_CPU="486SX"
VANTOR_LIBC="glibc"
VANTOR_COMPILER="gcc"
VANTOR_BINUTILS="binutils"
VANTOR_USERLAND="busybox"

VANTOR_BUILD_JOBS="2"
VANTOR_SOURCE_DIR="build/distfiles"
VANTOR_WORK_DIR="build/work"
VANTOR_OUTPUT_DIR="output"
VANTOR_ROOTFS_DIR="rootfs"
