name: Build VANTOR Termux ARM64 userspace

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/prepare-rootfs.py"
      - "packages/nyan/nyan"
      - "tests/test_nyan.py"
      - "build/scripts/build-termux-rootfs.sh"
      - "tools/termux/**"
      - "tests/test_termux.py"
      - "assets/branding/**"
      - "build/sources/sources.json"
      - ".github/workflows/build-termux.yml"
      - "Dockerfile.termux"

permissions:
  contents: write

concurrency:
  group: vantor-termux-arm64
  cancel-in-progress: false

jobs:
  build:
    name: Build ARM64 PRoot rootfs
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential bzip2 python3 file
      - name: Build VANTOR ARM64 userspace
        env:
          VANTOR_BUILD_JOBS: 4
        run: bash build/scripts/build-termux-rootfs.sh
      - name: Validate ARM64 userspace
        run: |
          file build/work/rootfs-termux/bin/busybox
          readelf -h build/work/rootfs-termux/bin/busybox | grep -q 'Class:.*ELF64'
          readelf -h build/work/rootfs-termux/bin/busybox | grep -q 'Machine:.*AArch64'
          test -x build/work/rootfs-termux/usr/bin/vantor-termux-shell
          test -x build/work/rootfs-termux/bin/sh
          test -s build/work/rootfs-termux/etc/os-release
          test -x build/work/rootfs-termux/usr/bin/vantor-info
          test -x build/work/rootfs-termux/usr/bin/vantor-doctor
          sh -n build/work/rootfs-termux/usr/bin/vantor-termux-shell
          sh -n build/work/rootfs-termux/usr/bin/vantor-info
          sh -n build/work/rootfs-termux/usr/bin/vantor-doctor
          sh -n tools/termux/vantor
          sh -n tools/termux/install-vantor
          sh -n tools/termux/vantor-pd
          python3 -m unittest discover -s tests -p test_termux.py -v
          build/work/rootfs-termux/bin/busybox --help >/dev/null
      - name: Package reproducible rootfs archive
        run: |
          mkdir -p output
          tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner \
            -czf output/vantor-termux-aarch64-0.1.0.tar.gz -C build/work/rootfs-termux .
          tar -tzf output/vantor-termux-aarch64-0.1.0.tar.gz >/dev/null
          (cd output && sha256sum vantor-termux-aarch64-0.1.0.tar.gz > SHA256SUMS)
          test "$(awk '$2 == "vantor-termux-aarch64-0.1.0.tar.gz" { print $1 }' output/SHA256SUMS | wc -c)" -eq 65
          (cd output && sha256sum -c SHA256SUMS)
      - name: Upload rootfs artifact
        uses: actions/upload-artifact@v4
        with:
          name: vantor-termux-aarch64-${{ github.sha }}
          path: output/*
          if-no-files-found: error
          retention-days: 30
      - name: Publish Termux rootfs release
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create termux-aarch64 output/vantor-termux-aarch64-0.1.0.tar.gz output/SHA256SUMS \
            --repo "${GITHUB_REPOSITORY}" \
            --title "VANTOR Termux ARM64 0.1.0" \
            --notes "ARM64 VANTOR userspace for Termux + PRoot. Android supplies the host kernel; this archive is not a bootable OS image." \
            --prerelease 2>/dev/null || \
          gh release upload termux-aarch64 output/vantor-termux-aarch64-0.1.0.tar.gz output/SHA256SUMS \
            --repo "${GITHUB_REPOSITORY}" --clobber
      - name: Publish Docker Hub image (optional credentials)
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
            docker buildx build --platform linux/arm64 \
              -f Dockerfile.termux \
              -t "$DOCKERHUB_USERNAME/vantor-linux:termux-arm64" --push .
            docker logout
          else
            echo "[INFO] Docker Hub credentials not configured; GitHub Release remains the distribution channel."
          fi
