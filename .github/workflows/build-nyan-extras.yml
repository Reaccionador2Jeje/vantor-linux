name: Build and publish Nyan extras
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "core/hardware/vantor-hw"
      - "installer/vantor-install"
      - "assets/branding/**"
      - "README.md"
      - "LICENSE"
      - "docs/nyan.md"
      - "packages/addons/**"
      - "tools/build-nyan-extras.sh"
      - ".github/workflows/build-nyan-extras.yml"
      - "tools/publish-package.sh"
permissions:
  contents: write
concurrency:
  group: vantor-nyan-extras-publish
  cancel-in-progress: false
jobs:
  build-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out VANTOR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build architecture-independent payloads
        run: bash tools/build-nyan-extras.sh
      - name: Publish architecture-specific and universal Nyan packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          publish() {
            local archive="$1" name="$2" arch="$3" description="$4" dependency="${5:-}"
            if [ -n "$dependency" ]; then
              bash tools/publish-package.sh "$archive" "$name" 0.1.0 "$arch" "$description" "$dependency"
            else
              bash tools/publish-package.sh "$archive" "$name" 0.1.0 "$arch" "$description"
            fi
          }
          for arch in x86_64 i486 aarch64; do
            publish "build/nyan-extras/vantor-hardware-0.1.0-$arch.tar.gz" vantor-hardware "$arch" "VANTOR read-only hardware inventory utility"
            if [ "$arch" != aarch64 ]; then
              publish "build/nyan-extras/vantor-installer-0.1.0-$arch.tar.gz" vantor-installer "$arch" "VANTOR text-mode system installer" vantor-base-files
            fi
            publish "build/nyan-extras/vantor-branding-0.1.0-$arch.tar.gz" vantor-branding "$arch" "Official VANTOR identity assets"
            publish "build/nyan-extras/vantor-docs-0.1.0-$arch.tar.gz" vantor-docs "$arch" "VANTOR system and Nyan documentation"
          done
          for tool in vantor-about vantor-doctor vantor-netdiag vantor-logview vantor-config-backup vantor-mountinfo; do
            for arch in x86_64 i486 aarch64; do
              publish "build/nyan-extras/$tool-0.1.0-all.tar.gz" "$tool" "$arch" "VANTOR utility: $tool (architecture-independent)"
            done
          done
          for tool in fastfetch tree watch which filetype vtop vram vpath vusers vtime vchecksum varchive vps vdf vdu vports vman; do
            for arch in x86_64 i486 aarch64; do
              publish "build/nyan-extras/$tool-0.1.0-all.tar.gz" "$tool" "$arch" "VANTOR terminal utility: $tool"
            done
          done
      - name: Upload package archives
        uses: actions/upload-artifact@v4
        with:
          name: vantor-nyan-extras-${{ github.sha }}
          path: build/nyan-extras/*.tar.gz
          if-no-files-found: error
          retention-days: 30
