name: Build VANTOR x86_64 kernel

on:
  workflow_dispatch:
  push:
    paths:
      - "build/scripts/build-kernel.sh"
      - "build/config/vantor.conf"
      - "build/sources/sources.json"
      - "tools/fetch-sources.py"
      - "tools/extract-source.py"
      - "tests/test_kernel_build.py"
      - "Makefile"
      - "kernel/**"
      - ".github/workflows/build-kernel.yml"

permissions:
  contents: read

concurrency:
  group: vantor-x86_64-kernel
  cancel-in-progress: true

jobs:
  build-x86_64-kernel:
    name: Compile Linux 6.18.65 for VANTOR
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out VANTOR
        uses: actions/checkout@v4

      - name: Install kernel build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libelf-dev libncurses-dev \
            dwarves kmod python3 xz-utils

      - name: Validate pinned kernel source and repository contracts
        run: |
          python3 tools/validate-sources.py --require-pinned --only linux
          make check

      - name: Build VANTOR x86_64 kernel
        run: make kernel

      - name: Inspect kernel image and configuration
        run: |
          test -s build/work/kernel/vantor-kernel
          test -s build/work/kernel/kernelrelease
          test -d "build/work/modules/lib/modules/$(cat build/work/kernel/kernelrelease)"
          find "build/work/modules/lib/modules/$(cat build/work/kernel/kernelrelease)" -type f | grep -q .
          file build/work/kernel/vantor-kernel
          grep -q '^CONFIG_X86_64=y$' kernel/configs/vantor-x86_64.config
          grep -q '^CONFIG_BLK_DEV_INITRD=y$' kernel/configs/vantor-x86_64.config
          grep -q '^CONFIG_VIRTIO_BLK=y$' kernel/configs/vantor-x86_64.config
          grep -q '^CONFIG_VIRTIO_NET=y$' kernel/configs/vantor-x86_64.config
          grep -q '^CONFIG_EXT4_FS=y          grep -q '^CONFIG_ISO9660_FS=y$' kernel/configs/vantor-x86_64.config
          grep -q '^CONFIG_FRAMEBUFFER_CONSOLE=y$' kernel/configs/vantor-x86_64.config

      - name: Upload kernel and build configuration
        uses: actions/upload-artifact@v4
        with:
          name: vantor-x86_64-kernel-${{ github.sha }}
          path: |
            build/work/kernel/vantor-kernel
            build/work/kernel/kernelrelease
            build/work/modules/lib/modules/**
            kernel/configs/vantor-x86_64.config
            build/logs/kernel-build.log
          if-no-files-found: error
          retention-days: 14
 kernel/configs/vantor-x86_64.config
          grep -q '^CONFIG_EXT2_FS=y          grep -q '^CONFIG_ISO9660_FS=y$' kernel/configs/vantor-x86_64.config
          grep -q '^CONFIG_FRAMEBUFFER_CONSOLE=y$' kernel/configs/vantor-x86_64.config

      - name: Upload kernel and build configuration
        uses: actions/upload-artifact@v4
        with:
          name: vantor-x86_64-kernel-${{ github.sha }}
          path: |
            build/work/kernel/vantor-kernel
            build/work/kernel/kernelrelease
            build/work/modules/lib/modules/**
            kernel/configs/vantor-x86_64.config
            build/logs/kernel-build.log
          if-no-files-found: error
          retention-days: 14
 kernel/configs/vantor-x86_64.config
          grep -q '^CONFIG_VFAT_FS=y          grep -q '^CONFIG_ISO9660_FS=y$' kernel/configs/vantor-x86_64.config
          grep -q '^CONFIG_FRAMEBUFFER_CONSOLE=y$' kernel/configs/vantor-x86_64.config

      - name: Upload kernel and build configuration
        uses: actions/upload-artifact@v4
        with:
          name: vantor-x86_64-kernel-${{ github.sha }}
          path: |
            build/work/kernel/vantor-kernel
            build/work/kernel/kernelrelease
            build/work/modules/lib/modules/**
            kernel/configs/vantor-x86_64.config
            build/logs/kernel-build.log
          if-no-files-found: error
          retention-days: 14
 kernel/configs/vantor-x86_64.config
          grep -q '^CONFIG_FAT_FS=y          grep -q '^CONFIG_ISO9660_FS=y$' kernel/configs/vantor-x86_64.config
          grep -q '^CONFIG_FRAMEBUFFER_CONSOLE=y$' kernel/configs/vantor-x86_64.config

      - name: Upload kernel and build configuration
        uses: actions/upload-artifact@v4
        with:
          name: vantor-x86_64-kernel-${{ github.sha }}
          path: |
            build/work/kernel/vantor-kernel
            build/work/kernel/kernelrelease
            build/work/modules/lib/modules/**
            kernel/configs/vantor-x86_64.config
            build/logs/kernel-build.log
          if-no-files-found: error
          retention-days: 14
 kernel/configs/vantor-x86_64.config
          grep -q '^CONFIG_ISO9660_FS=y$' kernel/configs/vantor-x86_64.config
          grep -q '^CONFIG_FRAMEBUFFER_CONSOLE=y$' kernel/configs/vantor-x86_64.config

      - name: Upload kernel and build configuration
        uses: actions/upload-artifact@v4
        with:
          name: vantor-x86_64-kernel-${{ github.sha }}
          path: |
            build/work/kernel/vantor-kernel
            build/work/kernel/kernelrelease
            build/work/modules/lib/modules/**
            kernel/configs/vantor-x86_64.config
            build/logs/kernel-build.log
          if-no-files-found: error
          retention-days: 14
