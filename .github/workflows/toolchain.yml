name: VANTOR Toolchain

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vantor-toolchain-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-bootstrap:
    name: Build Binutils and GCC pass 1
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out VANTOR
        uses: actions/checkout@v4

      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bison flex texinfo \
            libgmp-dev libmpfr-dev libmpc-dev zlib1g-dev \
            python3 xz-utils

      - name: Show host tool versions
        run: |
          gcc --version
          make --version
          python3 --version

      - name: Build initial cross-toolchain
        run: make toolchain

      - name: Upload toolchain and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vantor-bootstrap-${{ github.run_number }}
          path: |
            build/tools/
            build/logs/
          if-no-files-found: warn
          retention-days: 14
