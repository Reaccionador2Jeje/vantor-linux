name: Build VANTOR Minimal Legacy i486 ISO

on:
  workflow_dispatch:
  push:
    paths:
      - "build/scripts/build-kernel-legacy.sh"
      - "build/scripts/build-busybox-legacy.sh"
      - "build/scripts/build-openrc.sh"\n      - "build/scripts/build-sudo.sh"
      - "core/openrc/**"
      - "build/scripts/build-busybox-legacy.sh"
      - "build/scripts/build-initramfs.sh"
      - "build/scripts/build-iso-legacy.sh"
      - "build/config/vantor.conf"
      - "build/sources/sources.json"
      - "tools/extract-source.py"
      - "tools/fetch-sources.py"
      - "tools/validate-sources.py"
      - "tests/test_source_tools.py"
      - "tools/prepare-rootfs.py"
      - "boot/grub/grub-legacy.cfg"
      - "Makefile"
      - "tests/test_kernel_build.py"
      - "tests/test_initramfs_build.py"
      - ".github/workflows/build-legacy-image.yml"

permissions:
  contents: write

concurrency:
  group: vantor-legacy-image
  cancel-in-progress: true

jobs:
  build-i486-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out VANTOR
        uses: actions/checkout@v4
      - name: Install legacy image build dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev libncurses-dev gcc-multilib libc6-dev-i386 libcap-dev:i386 libcrypt-dev:i386 fakeroot meson ninja-build pkg-config cpio gzip bzip2 grub-pc-bin grub-common xorriso mtools
      - name: Validate source and project contracts
        run: |
          make check
          python3 tools/validate-sources.py --require-pinned --only linux-legacy busybox openrc
      - name: Build complete i486 Minimal BIOS image with OpenRC
        run: make image-legacy
      - name: Inspect image
        run: |
          file output/vantor-minimal-0.1.0-i486.iso
          test -s output/vantor-minimal-0.1.0-i486.iso
          test -s build/work/kernel-legacy/arch/x86/boot/bzImage
          gzip -t build/work/initramfs-legacy/vantor-legacy-initramfs.cpio.gz
          readelf -h build/work/rootfs-legacy/sbin/openrc-init | grep -q "Intel 80386"
          readelf -l build/work/rootfs-legacy/sbin/openrc-init | grep -qv INTERP
          test "$(readlink build/work/rootfs-legacy/sbin/init)" = "/sbin/openrc-init"
          grep -q '^CONFIG_M486SX=y$' kernel/configs/vantor-i486.config
      - name: Generate ISO checksum
        run: sha256sum output/vantor-minimal-0.1.0-i486.iso > output/vantor-minimal-0.1.0-i486.iso.sha256

      - name: Publish Legacy preview ISO to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: vantor-minimal-0.1.0-i486
          name: VANTOR Minimal Legacy 0.1.0 — i486 Preview
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          body: |
            VANTOR Minimal Legacy i486 ISO built by GitHub Actions.

            **Preview build:** compilation and ISO structure checks passed. Hardware boot compatibility has not yet been validated.
          files: |
            output/vantor-minimal-0.1.0-i486.iso
            output/vantor-minimal-0.1.0-i486.iso.sha256

      - name: Upload unboot-tested ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: vantor-minimal-i486-iso-${{ github.sha }}
          path: |
            output/vantor-minimal-0.1.0-i486.iso
            kernel/configs/vantor-i486.config
          if-no-files-found: error
          retention-days: 14
