name: VANTOR Genesis — Build Userspace
on:
  workflow_dispatch:
  push:
    paths:
      - "build/scripts/build-busybox.sh"
      - "build/scripts/build-openrc.sh"\n      - "build/scripts/build-sudo.sh"
      - "core/openrc/**"
      - "build/scripts/build-initramfs.sh"
      - "build/sources/sources.json"
      - "tools/fetch-sources.py"
      - "tools/extract-source.py"
      - "tools/prepare-rootfs.py"
      - "Makefile"
      - ".github/workflows/build-userspace.yml"
permissions:
  contents: read
concurrency:
  group: vantor-userspace-${{ github.ref }}
  cancel-in-progress: true
jobs:
  userspace:
    name: Build static BusyBox and initramfs
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out VANTOR
        uses: actions/checkout@v4
      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bzip2 cpio gzip meson ninja-build pkg-config libcap-dev libcrypt-dev fakeroot psmisc
      - name: Assemble VANTOR rootfs
        run: make rootfs
      - name: Build static BusyBox
        run: make busybox
      - name: Build static sudo and sudoers tools
        run: make sudo
      - name: Build OpenRC PID 1 and VANTOR services
        run: make openrc
      - name: Assemble initramfs
        run: make initramfs
      - name: Inspect initramfs
        run: |
          gzip -t build/work/initramfs/vantor-initramfs.cpio.gz
          test -x build/work/rootfs/init
          test -x build/work/rootfs/bin/busybox
          test -x build/work/rootfs/sbin/openrc-init
          test "$(readlink build/work/rootfs/sbin/init)" = "/sbin/openrc-init"
          ls -lh build/work/initramfs/vantor-initramfs.cpio.gz
      - name: Upload early userspace artifact
        uses: actions/upload-artifact@v4
        with:
          name: vantor-genesis-initramfs-${{ github.sha }}
          path: build/work/initramfs/vantor-initramfs.cpio.gz
          if-no-files-found: error
          retention-days: 14
