name: Build VANTOR Desktop configuration package
on:
  workflow_dispatch:
  push:
    paths:
      - "desktop/**"
      - ".github/workflows/build-desktop-config.yml"
      - "tools/publish-package.sh"
permissions:
  contents: write
concurrency:
  group: vantor-desktop-config
  cancel-in-progress: false
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout VANTOR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate desktop session and assemble package
        shell: bash
        run: |
          set -Eeuo pipefail
          sh -n desktop/bin/vantor-session
          test -s desktop/xsessions/vantor.desktop
          test -s desktop/openbox/rc.xml
          test -s desktop/openbox/menu.xml
          test -s desktop/tint2/tint2rc
          root="$PWD/build/vantor-desktop-config"
          install -D -m 0755 desktop/bin/vantor-session "$root/usr/bin/vantor-session"
          install -D -m 0644 desktop/xsessions/vantor.desktop "$root/usr/share/xsessions/vantor.desktop"
          mkdir -p "$root/usr/share/vantor/desktop"
          cp -a desktop/openbox desktop/tint2 desktop/themes desktop/applications "$root/usr/share/vantor/desktop/"
          tar -czf build/vantor-desktop-config-0.1.0-all.tar.gz -C "$root" .
          tar -tzf build/vantor-desktop-config-0.1.0-all.tar.gz
          sha256sum build/vantor-desktop-config-0.1.0-all.tar.gz
      - name: Publish Nyan package and dependency metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash tools/publish-package.sh \
            build/vantor-desktop-config-0.1.0-all.tar.gz \
            vantor-desktop-config 0.1.0 all \
            "VANTOR branded Openbox and tint2 desktop session configuration" \
            xorg-server,openbox,tint2,xsetroot
      - name: Upload package build artifact
        uses: actions/upload-artifact@v4
        with:
          name: vantor-desktop-config-0.1.0
          path: build/vantor-desktop-config-0.1.0-all.tar.gz
          if-no-files-found: error
          retention-days: 14
