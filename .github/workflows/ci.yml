name: VANTOR CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vantor-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Show project configuration
        run: make info

      - name: Validate configuration, shell scripts and source manifest
        run: make check

      - name: Validate visual identity metadata
        run: python -m json.tool assets/branding/theme.json > /dev/null

      - name: Check required repository paths
        run: |
          test -f README.md
          test -f LICENSE
          test -f Makefile
          test -f build/config/vantor.conf
          test -f docs/architecture.md
          test -f docs/toolchain.md
          test -f docs/testing-limbo.md
          test -f docs/branding.md
          test -f assets/branding/README.md
          test -f assets/branding/vantor-mark.svg
          test -f assets/branding/vantor-lockup.svg
          test -f assets/branding/theme.css
          test -f assets/branding/theme.json
          test -f boot/branding/README.md
          test -f build/sources/sources.json
          test -f tools/validate-sources.py
          test -f tools/fetch-sources.py
          test -f tools/extract-source.py
          test -f build/scripts/build-binutils.sh
          test -f build/scripts/build-gcc.sh
          test -f build/scripts/build-toolchain.sh
          test -f .github/workflows/toolchain.yml
          test -f tests/test_source_tools.py
          echo "Repository layout and branding assets are valid."
