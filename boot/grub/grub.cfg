# VANTOR Linux — branded GRUB 2 boot menu
set default=0
set timeout=8
set timeout_style=menu
set menu_color_normal="light-gray/black"
set menu_color_highlight="black/cyan"

insmod all_video
insmod gfxterm
insmod gfxmenu
loadfont unicode
set gfxmode=auto
terminal_output gfxterm
set gfxpayload=keep
set theme=/boot/grub/themes/vantor/theme.txt

menuentry "VANTOR Linux — Live Genesis" --class vantor {
    search --no-floppy --file --set=root /boot/vantor-kernel
    linux /boot/vantor-kernel console=tty0 quiet loglevel=3 vt.global_cursor_default=0 splash
    initrd /boot/vantor-initramfs.cpio.gz
}

menuentry "VANTOR Linux — Live (Diagnostic mode)" --class recovery {
    search --no-floppy --file --set=root /boot/vantor-kernel
    linux /boot/vantor-kernel console=tty0 loglevel=7 initcall_debug nosplash
    initrd /boot/vantor-initramfs.cpio.gz
}

menuentry "Reboot" --class reboot { reboot }
menuentry "Power off" --class shutdown { halt }
