# VANTOR Linux — GRUB 2 boot menu
set default=0
set timeout=5
set timeout_style=menu
set menu_color_normal="white/black"
set menu_color_highlight="black/light-cyan"

insmod all_video
insmod gfxterm
terminal_output gfxterm

menuentry "VANTOR Linux — Genesis" --class vantor {
    search --no-floppy --file --set=root /boot/vantor-kernel
    linux /boot/vantor-kernel console=tty0 loglevel=4
    initrd /boot/vantor-initramfs.cpio.gz
}

menuentry "VANTOR Linux — Diagnostic mode" --class recovery {
    search --no-floppy --file --set=root /boot/vantor-kernel
    linux /boot/vantor-kernel console=tty0 loglevel=7 initcall_debug
    initrd /boot/vantor-initramfs.cpio.gz
}

menuentry "Reboot" --class reboot { reboot }
menuentry "Power off" --class shutdown { halt }
