# VANTOR Minimal Legacy — GRUB BIOS menu
set default=0
set timeout=5
set timeout_style=menu
set menu_color_normal="white/black"
set menu_color_highlight="black/light-cyan"
terminal_output console

menuentry "VANTOR Minimal Legacy — i486" --class vantor {
    search --no-floppy --file --set=root /boot/vantor-legacy-kernel
    linux /boot/vantor-legacy-kernel console=tty0 loglevel=4
    initrd /boot/vantor-legacy-initramfs.cpio.gz
}

menuentry "VANTOR Minimal Legacy — Diagnostic mode" --class recovery {
    search --no-floppy --file --set=root /boot/vantor-legacy-kernel
    linux /boot/vantor-legacy-kernel console=tty0 loglevel=7 initcall_debug
    initrd /boot/vantor-legacy-initramfs.cpio.gz
}

menuentry "Reboot" --class reboot { reboot }
menuentry "Power off" --class shutdown { halt }
