# VANTOR Minimal Legacy — branded BIOS text menu
set default=0
set timeout=8
set timeout_style=menu
set menu_color_normal="light-gray/black"
set menu_color_highlight="black/cyan"
terminal_output console

echo "VANTOR LINUX LEGACY"
echo "ONE SYSTEM. EVERY GENERATION."
echo "----------------------------------------"

menuentry "VANTOR Linux Legacy — Live i486" --class vantor {
    search --no-floppy --file --set=root /boot/vantor-legacy-kernel
    linux /boot/vantor-legacy-kernel console=tty0 quiet loglevel=3 vt.global_cursor_default=0 splash
    initrd /boot/vantor-legacy-initramfs.cpio.gz
}

menuentry "VANTOR Linux Legacy — Live (Diagnostic mode)" --class recovery {
    search --no-floppy --file --set=root /boot/vantor-legacy-kernel
    linux /boot/vantor-legacy-kernel console=tty0 loglevel=7 initcall_debug nosplash
    initrd /boot/vantor-legacy-initramfs.cpio.gz
}

menuentry "Reboot" --class reboot { reboot }
menuentry "Power off" --class shutdown { halt }
